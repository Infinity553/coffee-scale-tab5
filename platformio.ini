; Coffee Scale Display for M5Stack Tab5 (ESP32-P4) + Acaia Lunar
; Requires the pioarduino platform (Arduino-ESP32 core 3.3.x) which supports
; BLE on the ESP32-P4 through the ESP32-C6 co-processor (ESP-Hosted).

[platformio]
default_envs = m5stack-tab5

[env:m5stack-tab5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = m5stack-tab5-p4
framework = arduino
board_build.partitions = default_16MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 1500000
extra_scripts =
    pre:tools/embed_web.py
    post:tools/archive_elf.py
lib_deps =
    https://github.com/M5Stack/M5Unified.git
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -O2
build_unflags =
    -Os

; One-off: update the Tab5's ESP32-C6 co-processor firmware over Wi-Fi
;   pio run -e c6-update -t upload && pio device monitor -e c6-update
[env:c6-update]
extends = env:m5stack-tab5
build_src_filter = -<*> +<../tools/c6_updater/>

; Desktop UI simulator (needs SDL2: brew install sdl2)
;   pio run -e native && .pio/build/native/program
[env:native]
platform = native
extra_scripts = pre:tools/embed_web.py
lib_deps =
    https://github.com/M5Stack/M5Unified.git
    bblanchon/ArduinoJson@^7.2.0
build_src_filter = +<*> -<main.cpp> -<AcaiaScale.cpp> -<Storage.cpp> -<Net.cpp> -<Diag.cpp> +<../sim/*.cpp>
build_flags =
    -O1 -std=c++17 -lSDL2
    -Isim/include
    -I"${sysenv.HOMEBREW_PREFIX}/include/SDL2"
    -L"${sysenv.HOMEBREW_PREFIX}/lib"
    -DM5GFX_BOARD=board_M5Tab5
    -DM5GFX_SCALE=1
